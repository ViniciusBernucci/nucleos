[project]
name = "nucleos-enterprise-python"
version = "0.0.0"
description = "Raiz do workspace uv dos servicos Python (nao publicavel)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[tool.pytest.ini_options]
testpaths = ["services"]
addopts = "--import-mode=importlib"
