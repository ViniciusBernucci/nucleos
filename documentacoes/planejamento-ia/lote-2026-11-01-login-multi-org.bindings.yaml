    "acceptance":
      - "LGN-AC-01: Todo erro da API sai como Problem Details (RFC 9457, application/problem+json) com correlation_id, sem stack, sem mensagem interna e sem eco de entrada; erro inesperado → 500 genérico com detalhes só em log; corpo JSON com campo não previsto em rota nova → 400. Rotas existentes (/healthz, /v1/vendas) continuam funcionando; testes unitários cobrem."
      - "LGN-AC-02: A migration 0002 cria schema iam (users: id uuid, email citext/único normalizado em minúsculas, nome, password_hash PHC, status active|disabled, failed_logins, locked_until, created_at/updated_at timestamptz; sessions: id, user_id, token_hash único, created_at, last_seen_at, idle_expires_at, absolute_expires_at, revoked_at, user_agent; índice (user_id) parcial para não revogadas) e schema tenancy (organizations: id uuid imutável por trigger, slug único validado ^[a-z0-9-]{2,40}$, name, status; memberships: organization_id, user_id, status, UNIQUE(organization_id,user_id), índice (user_id)); aplica do zero, a reaplicação informa nada a aplicar, e UPDATE do id de organização falha — provado em teste de integração com Postgres real."
