  "u3_implement":
    "ticket_id": "LGN-U3"
    "objective": "Front-end Next.js com login real: /login, logout, /orgs com as organizações reais do usuário, área logada sob /orgs/[orgSlug] com organização ativa no layout, painel de vendas chamando a API com a sessão, e remoção dos mocks de autenticação e da chave de serviço."
    "scope":
      - "apps/web/app/login/, apps/web/app/orgs/, apps/web/app/orgs/[orgSlug]/ (área que hoje está em apps/web/app/(app)/)"
      - "apps/web/lib/ (cliente da API servidor-a-servidor com sessão; leitura do cookie; substitui a chave em vendas-api.ts/vendas-atualizacao.ts)"
      - "apps/web proteção de rotas (proxy/middleware do Next 16 só para UX) e Server Actions de login/logout"
      - "remoção de apps/web/lib/mock-security.ts e fixtures/telas mock de auth não mais usadas; testes em apps/web/app/**/*.test.ts"
      - "documentacoes/identidade/2026-11-01-login-multi-org.md, documentacoes/interface-web/manual-frontend.md, lessons"
    "acceptance":
      - "LGN-AC-13: /login (Server Component + Server Action) envia e-mail/senha à API real; em sucesso grava o token num cookie 'nucleos_sessao' HttpOnly, SameSite=Lax, Path=/, Secure conforme config (obrigatório fora de local) e expiração igual à absoluta, e redireciona para /orgs (ou para a org única quando houver só uma); em falha mostra mensagem genérica sem distinguir o motivo; a senha nunca é registrada em log nem devolvida ao cliente."
      - "LGN-AC-14: /orgs lista as organizações reais do usuário (GET /v1/orgs com a sessão); usuario-a vê só 'nucleos', usuario-ab vê as duas; o layout de /orgs/[orgSlug]/... mostra de forma persistente a organização ativa e permite trocar de organização."
      - "LGN-AC-15: /orgs/[orgSlug]/... valida o slug na API a cada render (GET /v1/orgs/{slug}); org sem membership ou inexistente → notFound() sem dados da outra org; com sessão de usuario-b, /orgs/nucleos/setores/financeiro/vendas → 404."
      - "LGN-AC-16: Nenhum token em localStorage/sessionStorage nem em props de Client Components; o token só existe no cookie HttpOnly e no servidor; teste automatizado varre o código do web garantindo ausência de localStorage/sessionStorage com o token e de NEXT_PUBLIC_* de credencial."
      - "LGN-AC-17: Logout (Server Action) chama POST /v1/auth/logout, apaga o cookie e redireciona para /login; qualquer 401 da API (sessão revogada/expirada) apaga o cookie e redireciona para /login; sem cookie, /, /orgs e /orgs/... redirecionam para /login (proxy/middleware só como UX; a verificação real é a API)."
      - "LGN-AC-18: Estados padronizados (carregando, vazio, erro, 404, offline/API indisponível) existem para /orgs e para a área da organização, com textos pt-BR centralizados, e têm teste com node:test."
      - "LGN-AC-19: O painel de vendas funciona em /orgs/nucleos/setores/financeiro/vendas usando a sessão (vendas-api.ts passa a enviar o token da sessão para /v1/orgs/{slug}/vendas/...); VENDAS_API_KEY/_FILE deixam de existir no web (código, testes, .env.example); não resta import de mock-security nem tela mock de login/orgs; links internos do menu apontam para o prefixo da org; make build lint test contracts-check passam."
    "instructions": "Depende de u2 (mesma worktree; leia o documento do lote e os contratos gerados em packages/contracts antes). IMPORTANTE: apps/web/AGENTS.md avisa que este Next.js (16.x) tem breaking changes — leia o guia pertinente em node_modules/next/dist/docs/ antes de escrever código (em especial cookies(), Server Actions, redirect/notFound e a convenção de proxy/middleware). Siga documentacoes/interface-web/manual-frontend.md (o manual proíbe autenticação no cliente: toda lógica de sessão fica no servidor Next). ZERO dependências novas (sem biblioteca de UI/estado, sem Playwright).\n\nARQUITETURA: o navegador só fala com o servidor Next; o servidor Next chama a API (URL em VENDAS_API_URL, renomeie para NUCLEOS_API_URL mantendo compatibilidade ou documente a escolha) enviando Authorization: Bearer <token lido do cookie>. Centralize num único cliente servidor (por exemplo apps/web/lib/api-servidor.ts, com 'server-only' por convenção de pasta/comentário se o pacote não existir) que trata 401 → limpa cookie e redirect('/login'), 404 → notFound(), indisponível → estado de erro/offline. Server Actions são o único ponto de escrita do cookie.\n\nROTAS: mova o conteúdo do grupo (app) para app/orgs/[orgSlug]/ (layout com AppShell + indicador da org ativa + troca de org + botão sair), preservando setores/financeiro/vendas e componentes; '/' redireciona para /orgs (ou /login sem sessão). Remova DashboardClientShell/fixtures/mocks que só serviam a login/orgs; mocks de outras superfícies que ainda forem usados podem ficar, marcados como demonstração.\n\nTESTES: node:test (padrão atual app/**/*.test.ts) para o cliente da API (401/404/erro), opções do cookie (Secure fora de local), redirecionamentos, estados e a varredura de LGN-AC-16. Testes de tela são manuais (roteiro do lote).\n\nDOCUMENTAÇÃO: atualize o documento do lote e o -diffs.md (seção u3), o manual de front-end (nova estrutura de rotas e sessão; remover a menção a /login e /orgs como exceção legada), documentacoes/interface-web se aplicável, lessons (cookies HttpOnly e Server Actions no Next.js; proteção de rotas no servidor) e lessons/README.md. Rode e registre make build lint test contracts-check.\nFLUXO_ENXUTO_V1: execute somente este papel. Sem orquestrador, auditor, QA de tela por IA ou novas sessões. Preserve limites/checkpoints e regras do projeto. Testes de tela serão manuais no final. Não execute commits/merges: a entrega Git é uma etapa determinística posterior."
