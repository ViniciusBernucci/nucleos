    "ticket_id": "LGN-U2"
    "objective": "Autenticação com sessão opaca, bloqueio por força bruta, endpoints de identidade e organizações com isolamento por membership, e troca da chave de serviço do painel de vendas pela sessão do usuário membro da organização de vendas."
    "scope":
      - "apps/api/src/auth/ (login, logout, SessionGuard, limitador por e-mail) e controllers /v1/auth, /v1/me, /v1/orgs"
      - "apps/api/src/vendas/ (remover ChaveServicoGuard; rotas sob sessão + membership da org VENDAS_ORG_SLUG)"
      - "packages/config/src/vendas.ts (remover VENDAS_API_KEY) e .env.example"
      - "packages/contracts (OpenAPI de auth/me/orgs + make contracts-gen)"
      - "testes unitários e de integração; documentacoes/identidade/2026-11-01-login-multi-org.md; lessons"
    "acceptance":
      - "LGN-AC-06: POST /v1/auth/login {email, senha} com credencial válida retorna 200 com {token, expiraEm, usuario} e cria sessão com token de 32 bytes aleatórios (base64url) cujo banco guarda só sha256; e-mail inexistente, senha errada, usuário disabled ou bloqueado retornam o MESMO status 401 e o mesmo corpo Problem Details, com custo de hash equalizado (hash fictício para e-mail inexistente); a resposta tem Cache-Control no-store."
      - "LGN-AC-07: Após LOGIN_MAX_FAILURES falhas consecutivas a conta fica com locked_until = agora + LOGIN_LOCK_MINUTES e recusa inclusive a senha correta até expirar; sucesso zera failed_logins; um limitador em memória por e-mail normalizado limita a taxa de tentativas; teste de integração cobre."
      - "LGN-AC-08: A sessão é aceita por Authorization: Bearer <token>; SessionGuard busca por sha256, rejeita revogada, idle_expires_at vencido ou absolute_expires_at vencido com 401; renova idle_expires_at no máximo uma vez por minuto; POST /v1/auth/logout revoga (revoked_at) e a requisição seguinte com o mesmo token → 401; revogação direta no banco → 401; usuário desativado perde as sessões; teste de integração cobre."
      - "LGN-AC-09: GET /v1/me retorna o usuário da sessão; GET /v1/orgs lista só organizações ativas com membership ativa do usuário; GET /v1/orgs/:slug retorna {id, slug, nome} só com membership; slug inexistente e slug sem membership retornam 404 com corpo idêntico; nenhum endpoint aceita tenant_id/organization_id vindo do cliente (campo extra → 400); teste de integração com usuario-a, usuario-b e usuario-ab cobre."
      - "LGN-AC-10: As rotas de vendas passam a /v1/orgs/:slug/vendas/... (painel, listagem, sincronizacao GET/POST, sincronizacao/atualizar), exigem sessão e membership, e só respondem quando :slug = VENDAS_ORG_SLUG; outra org com membership → 404; sem sessão → 401; ChaveServicoGuard, CHAVE_SERVICO e VENDAS_API_KEY/_FILE removidos de API, config e .env.example; o agendador interno continua funcionando; testes de vendas atualizados."
      - "LGN-AC-11: Contrato OpenAPI em packages/contracts/openapi/control-plane.openapi.json (ou arquivo irmão seguindo o padrão do pacote) descreve /v1/auth/login, /v1/auth/logout, /v1/me, /v1/orgs, /v1/orgs/{slug} e as rotas de vendas movidas, com Problem Details; make contracts-gen regenera os tipos e make contracts-check passa sem drift; se a mudança for incompatível com a baseline, registre o motivo e não promova a baseline."
      - "LGN-AC-12: Logs estruturados de login (sucesso/falha/bloqueio) contêm só user_id ou hash do e-mail, correlation_id e motivo; nenhum log, Problem Details ou saída de teste contém senha, token, hash ou cabeçalho Authorization — teste verifica a ausência."
    "instructions": "Depende de u1 (mesma worktree; leia o documento documentacoes/identidade/2026-11-01-login-multi-org.md e o código de u1 antes). Parâmetros de config criados em u1. ZERO dependências novas; validação manual; pg puro.\n\nSEGURANÇA (ADR-016): token = randomBytes(32) base64url, entregue uma única vez no corpo do login (a API é chamada só pelo servidor web, que guarda o token num cookie HttpOnly da própria origem — isso é feito em u3); banco guarda sha256(token). Compare hashes com timingSafeEqual quando aplicável. Rehash da senha se os parâmetros argon2 mudarem. Mensagem genérica em todas as falhas de login. Respostas de auth com Cache-Control: no-store. O tenant é SEMPRE derivado de membership válida da sessão; o slug da URL é só contexto solicitado. 404 idêntico para slug inexistente e sem membership (sem vazamento de existência). Organização ou membership inativa equivale a ausente. Usuário disabled: login falha e sessões existentes são rejeitadas no guard.\n\nVENDAS: substitua o guard de chave por SessionGuard + guard/serviço de membership que exige :slug === config.VENDAS_ORG_SLUG; mova o controller para v1/orgs/:slug/vendas mantendo os sub-caminhos e o comportamento; remova CHAVE_SERVICO/ChaveServicoGuard e apiKey de packages/config/src/vendas.ts (e testes/paridade). O módulo de auth deve ser registrado quando houver banco (mesma lógica de pool do main.ts).\n\nTESTES: unitários para guard, serviço de senha, limitador e mapeamento de erros; integração (Postgres efêmero via make test-integracao) para LGN-AC-06..10 usando HTTP real do Nest (app.listen em 127.0.0.1 porta 0) ou injeção equivalente.\n\nDOCUMENTAÇÃO: atualize o documento do lote e o -diffs.md (seção u2), documentacoes/dados/banco-unico-nucleos.md se houver mudança de tabela, documentacoes/financeiro/ se a rota de vendas mudou (aponte para a nova rota), e as lessons (sessão opaca, prevenção de enumeração/força bruta, isolamento por membership) + lessons/README.md. Rode e registre make build lint test contracts-check e make test-integracao.\nFLUXO_ENXUTO_V1: execute somente este papel. Sem orquestrador, auditor, QA de tela por IA ou novas sessões. Preserve limites/checkpoints e regras do projeto. Testes de tela serão manuais no final. Não execute commits/merges: a entrega Git é uma etapa determinística posterior."
