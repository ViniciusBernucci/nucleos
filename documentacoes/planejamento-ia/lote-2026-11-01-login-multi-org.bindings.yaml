    "instructions": "Base: developer @ c5427047db13c8bb84e3a635298e94e89105caea. Rode 'make setup' antes de compilar (worktree nova sem node_modules).\n\nREGRAS DURAS: (1) Banco ÚNICO: tudo em schemas iam e tenancy do banco existente, via migration forward-only apps/api/migrations/0002_iam_tenancy.up.sql aplicada pelo runner atual (apps/api/src/migrar.ts; sem BEGIN/COMMIT; uma transação por arquivo). Não crie banco, container de funcionalidade, papel Postgres novo nem outro runner. Atualize o mapa de schemas em documentacoes/dados/banco-unico-nucleos.md. (2) ZERO dependências novas: argon2id via node:crypto (crypto.argon2 do Node 24.22, parâmetros m=19456 KiB, t=2, p=1, salt 16 bytes aleatório, saída em formato PHC $argon2id$v=19$m=...,t=...,p=...$salt$hash; verificação em tempo constante com timingSafeEqual). Se crypto.argon2 não estiver disponível ou falhar no Node do projeto, PARE com status BLOCKED e explique; não instale pacote. Validação de entrada manual, no padrão de apps/api/src/vendas/vendas.controller.ts. Cabeçalhos de segurança à mão (X-Content-Type-Options nosniff, Referrer-Policy no-referrer, X-Frame-Options DENY, Cache-Control no-store nas rotas de auth futuras, sem X-Powered-By). CORS desligado (a API só é chamada pelo servidor web). (3) citext: se a extensão não existir, crie-a na migration (CREATE EXTENSION IF NOT EXISTS citext) ou normalize e use text + índice único em lower(email) — escolha e documente. PKs uuid gerados na aplicação (crypto.randomUUID) e timestamptz.\n\nCONFIG (packages/config, zod, falha rápida, nomes de variáveis sem valores nas mensagens): SESSION_IDLE_MINUTES=30, SESSION_ABSOLUTE_HOURS=12, LOGIN_MAX_FAILURES=5, LOGIN_LOCK_MINUTES=15, PASSWORD_MIN_LENGTH=12, SESSION_COOKIE_SECURE (padrão true; false só aceito com APP_ENV=local), VENDAS_ORG_SLUG=nucleos. Acrescente só nomes/padrões ao .env.example, nunca valores secretos. Mantenha a paridade TS/Python se packages/config/paridade-casos.json exigir.\n\nTESTES DE INTEGRAÇÃO: siga o padrão de apps/api/src/integracao-pg.test.ts (skip sem TEST_DATABASE_URL, banco temporário próprio criado e removido). Crie scripts/test-integracao.sh (bash, set -euo pipefail) e o alvo 'test-integracao: build' no Makefile que o chama; porta aleatória livre em 127.0.0.1; nome de container único; trap de remoção; senha gerada por openssl/node em memória e passada por env ao docker run e ao node --test, nunca impressa. O alvo deve funcionar no Git Bash do Windows e em Linux.\n\nNão implemente login/sessão/guards nesta unidade (isso é u2), mas deixe repositórios e serviço de senha prontos para u2. O código do run abandonado em C:/Users/vinicius.silva/AppData/Local/contexto/projects/889883841c18419e/runs/31d6724286f0e3bb0542b6818c7971d0/worktree/apps/api (iam/, tenancy/, common/) pode ser consultado como referência, mas ele usa Kysely, banco nucleos_control e papéis control_* — NÃO copie essas decisões.\n\nDOCUMENTAÇÃO (obrigatória pelo CLAUDE.md): crie documentacoes/identidade/2026-11-01-login-multi-org.md (documento único do lote; u2/u3 atualizam) com as seções mínimas, comandos reais e resultados, e o arquivo -diffs.md; lessons aplicáveis (por exemplo hash de senha argon2id com node:crypto; Problem Details; migrations/schemas no banco único) atualizando lesson existente equivalente em vez de duplicar, e lessons/README.md. Rode e registre: make build lint test contracts-check e make test-integracao.\nFLUXO_ENXUTO_V1: execute somente este papel. Sem orquestrador, auditor, QA de tela por IA ou novas sessões. Preserve limites/checkpoints e regras do projeto. Testes de tela serão manuais no final. Não execute commits/merges: a entrega Git é uma etapa determinística posterior."
